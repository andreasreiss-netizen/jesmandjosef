<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JesmandJosef</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="JesmandJosef">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B3A9E">
<style>
:root{--bg:#FFF8DC;--ink:#1B1F4B;--soft:#5A5F8A;--card:#FFFFFF;--line:#EBDDA3;--blue:#2B3A9E;--red:#D83A2B;--gold:#F6D845;--ok:#1F8A4C;--okbg:#E3F5EA;--badbg:#FCE6E3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12163A;--ink:#FFF3C4;--soft:#AEB4E6;--card:#1D2352;--line:#343C7A;--blue:#8F9CFF;--red:#FF7A6B;--gold:#F6D845;--ok:#5FD08C;--okbg:#18382B;--badbg:#4A2530;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12163A;--ink:#FFF3C4;--soft:#AEB4E6;--card:#1D2352;--line:#343C7A;--blue:#8F9CFF;--red:#FF7A6B;--gold:#F6D845;--ok:#5FD08C;--okbg:#18382B;--badbg:#4A2530;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 18px 40px}
h1,h2,.big{font-family:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;line-height:1.1;margin:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top img{width:52px;height:52px;border-radius:14px;border:2px solid var(--ink);background:#fff}
.top h1{font-size:28px;font-weight:800}
.hero{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:end;background:var(--gold);color:#1B1F4B;border-radius:22px;padding:18px 18px 0;border:2px solid #1B1F4B;overflow:hidden}
.hero img{width:120px;display:block;border-radius:14px 14px 0 0;background:#fff}
.hero h2{font-size:26px;font-weight:800;padding-bottom:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.btn{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;min-height:56px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn small{display:block;font-weight:400;color:var(--soft)}
.primary{background:var(--blue);border-color:var(--blue);color:#fff;text-align:center}
.primary:hover{border-color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-size:15px;margin:14px 0 8px}
.q{font-size:34px;font-weight:800;text-align:center;padding:26px 8px;word-break:break-word}
.q.long{font-size:24px}
.btn.right{border-color:var(--ok);background:var(--okbg)}
.btn.wrong{border-color:var(--red);background:var(--badbg)}
.fb{min-height:28px;margin-top:14px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--red)}
.score{font-size:64px;font-weight:800;text-align:center}
.center{text-align:center}
ul.rev{padding:0;margin:8px 0 0;list-style:none}
ul.rev li{padding:10px 0;border-top:1px solid var(--line)}
ul.rev b{display:block}
.note{color:var(--soft);font-size:14px;margin-top:22px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<div class="top"><img alt="" src="assets/josef-icon.png"><h1>JesmandJosef</h1></div>

<section id="home">
  <div class="hero"><img alt="Josef mit blauer Kappe" src="assets/josef.jpg"><h2>Wie gut kennst du Mittelbadisch?</h2></div>
  <button class="btn primary" id="mA">Dialekt → Hochdeutsch<small id="bA" style="color:inherit;opacity:.85"></small></button>
  <button class="btn primary" id="mB">Hochdeutsch → Dialekt<small id="bB" style="color:inherit;opacity:.85"></small></button>
  <p class="note">Je Runde gibt es 10 Fragen aus <span id="cnt"></span> Wörtern. Die Einträge stammen aus einem Buch-Scan und sind noch nicht alle auf Tippfehler geprüft.</p>
</section>

<section id="play" hidden>
  <div class="meta"><span id="no"></span><span id="sc"></span></div>
  <div class="bar"><i id="pg"></i></div>
  <div class="card"><div class="q" id="qt"></div><div id="ans"></div><div class="fb" id="fb" role="status" aria-live="polite"></div></div>
  <button class="btn primary" id="next" hidden>Weiter</button>
</section>

<section id="end" hidden>
  <div class="card center"><div class="score" id="es"></div><h2 id="em"></h2><p id="eb" style="color:var(--soft)"></p></div>
  <div class="card" id="rv" hidden><h2 style="font-size:22px">Zum Nachlernen</h2><ul class="rev" id="rl"></ul></div>
  <button class="btn primary" id="again">Noch eine Runde</button>
  <button class="btn" id="back">Zur Startseite</button>
</section>
</main>
<script src="data/woerterbuch.js"></script>
<script>
const D=window.WOERTER||[];
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const N=10;
let best={a:0,b:0};
try{best=Object.assign(best,JSON.parse(localStorage.getItem('jj-best')||'{}'))}catch(e){}
const saveBest=()=>{try{localStorage.setItem('jj-best',JSON.stringify(best))}catch(e){}};
let mode='a',qs=[],i=0,score=0,wrong=[],locked=false;
const show=id=>{['home','play','end'].forEach(s=>$('#'+s).hidden=s!==id);window.scrollTo(0,0)};
function home(){$('#cnt').textContent=D.length;if(D.length<4){$('#mA').disabled=$('#mB').disabled=true}$('#bA').textContent=best.a?'Bestes Ergebnis: '+best.a+' von '+N:'';$('#bB').textContent=best.b?'Bestes Ergebnis: '+best.b+' von '+N:'';show('home')}
function build(e,pool,idx){
  const ok=e[idx],L=ok.length;
  const c=pool.filter(x=>x[0].toLowerCase()!==e[0].toLowerCase()&&x[idx].toLowerCase()!==ok.toLowerCase())
    .map(x=>[Math.abs(x[idx].length-L)+Math.random()*8,x[idx]]).sort((p,q)=>p[0]-q[0]);
  const out=[],seen=new Set([ok.toLowerCase()]);
  for(const [,t] of c){const k=t.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(t);if(out.length===3)break}}
  return {e,ok,opts:shuffle([ok,...out])};
}
function start(m){
  mode=m;const idx=m==='a'?1:0;
  const pool=m==='a'?D:D.filter(x=>x[1].length<=60);
  qs=shuffle(pool.slice()).slice(0,N).map(e=>build(e,pool,idx));
  i=0;score=0;wrong=[];show('play');ask();
}
function ask(){
  locked=false;const q=qs[i];
  $('#no').textContent='Frage '+(i+1)+' von '+N;$('#sc').textContent='Richtig: '+score;
  $('#pg').style.width=(i/N*100)+'%';
  const t=mode==='a'?q.e[0]:q.e[1];
  const qt=$('#qt');qt.textContent=t;qt.classList.toggle('long',t.length>22);
  $('#fb').textContent='';$('#fb').className='fb';$('#next').hidden=true;
  const box=$('#ans');box.textContent='';
  q.opts.forEach(o=>{const b=document.createElement('button');b.className='btn';b.textContent=o;b.onclick=()=>pick(b,o);box.appendChild(b)});
}
function pick(btn,o){
  if(locked)return;locked=true;const q=qs[i],fb=$('#fb');
  const right=o===q.ok;
  document.querySelectorAll('#ans .btn').forEach(b=>{if(b.textContent===q.ok)b.classList.add('right')});
  if(right){score++;fb.textContent='Richtig.';fb.className='fb ok'}
  else{btn.classList.add('wrong');wrong.push(q.e);fb.textContent='Falsch. Richtig ist: '+q.ok;fb.className='fb bad'}
  $('#sc').textContent='Richtig: '+score;$('#pg').style.width=((i+1)/N*100)+'%';
  const nx=$('#next');nx.textContent=i===N-1?'Ergebnis ansehen':'Weiter';nx.hidden=false;nx.focus();
}
$('#next').onclick=()=>{i++;i<N?ask():finish()};
function finish(){
  const isBest=score>(best[mode]||0);
  if(isBest){best[mode]=score;saveBest()}
  $('#es').textContent=score+' von '+N;
  $('#em').textContent=score===N?'Perfekt, kein Fehler.':score>=7?'Stark.':score>=4?'Solide, da geht noch mehr.':'Übung macht den Meister.';
  $('#eb').textContent=isBest&&score>0?'Neuer Bestwert in dieser Spielart.':'';
  const rl=$('#rl');rl.textContent='';
  wrong.forEach(e=>{const li=document.createElement('li'),b=document.createElement('b');b.textContent=e[0];li.appendChild(b);li.appendChild(document.createTextNode(e[1]));rl.appendChild(li)});
  $('#rv').hidden=!wrong.length;show('end');
}
$('#mA').onclick=()=>start('a');$('#mB').onclick=()=>start('b');
$('#again').onclick=()=>start(mode);$('#back').onclick=home;
home();
</script>
</body>
</html>
